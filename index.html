<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>otp load harness</title>
<style>
  * { box-sizing: border-box; }
  body {
    margin: 0; background: #0a0a0a; color: #00ff88;
    font-family: "SF Mono", Consolas, Menlo, monospace;
    font-size: 13px;
  }
  header {
    padding: 14px 20px; border-bottom: 1px solid #1f1f1f;
    display: flex; justify-content: space-between; align-items: center;
  }
  header h1 { font-size: 14px; margin: 0; letter-spacing: 1px; }
  .dot { width: 9px; height: 9px; border-radius: 50%; background: #ff3333; display: inline-block; margin-right: 6px; }
  .dot.on { background: #00ff88; box-shadow: 0 0 8px #00ff88; }
  .tabs { display: flex; border-bottom: 1px solid #1f1f1f; }
  .tab { padding: 10px 22px; cursor: pointer; color: #444; border-bottom: 2px solid transparent; user-select: none; }
  .tab.active { color: #00ff88; border-bottom-color: #00ff88; }
  .panel { display: none; padding: 20px; }
  .panel.active { display: block; }
  .row { margin-bottom: 12px; display: flex; gap: 10px; align-items: center; flex-wrap: wrap; }
  input, textarea, select, button {
    background: #111; color: #00ff88; border: 1px solid #1f1f1f;
    font-family: inherit; font-size: inherit; padding: 8px 10px; outline: none;
  }
  textarea { width: 100%; min-height: 140px; resize: vertical; }
  input:focus, textarea:focus, select:focus { border-color: #00ff88; }
  button { cursor: pointer; letter-spacing: 1px; text-transform: uppercase; }
  button:hover { background: #00ff88; color: #0a0a0a; }
  button.stop { border-color: #ff3333; color: #ff3333; }
  button.stop:hover { background: #ff3333; color: #0a0a0a; }
  .counter { font-size: 20px; margin-bottom: 14px; letter-spacing: 1px; }
  .counter span { color: #fff; }
  .log {
    background: #050505; border: 1px solid #1f1f1f;
    height: 380px; overflow-y: auto; padding: 10px;
    line-height: 1.55; font-size: 12px;
  }
  .log .hit { color: #00ff88; font-weight: bold; }
  .log .miss { color: #444; }
  .log .fail { color: #ff5555; }
  .log .ts { color: #333; margin-right: 8px; }
  small { color: #444; }
</style>
</head>
<body>

<header>
  <h1>otp load harness // qa</h1>
  <div><span class="dot" id="dotScan"></span><span class="dot" id="dotDispatch"></span>connected</div>
</header>

<div class="tabs">
  <div class="tab active" data-tab="scan">SCAN</div>
  <div class="tab" data-tab="dispatch">DISPATCH</div>
</div>

<div class="panel active" id="panel-scan">
  <div class="row">
    <label><input type="checkbox" id="autoScan" /> auto-scan built-in list</label>
  </div>
  <div class="row">
    <textarea id="domains" placeholder="one domain per line&#10;example.com&#10;another.com"></textarea>
  </div>
  <div class="row">
    <button id="startScan">start scan</button>
    <button id="stopScan" class="stop">stop</button>
    <small id="scanStatus">idle</small>
  </div>
  <div class="counter">candidates found: <span id="scanCount">0</span> &nbsp;|&nbsp; total in file: <span id="fileCount">0</span></div>
  <div class="log" id="scanLog"></div>
</div>

<div class="panel" id="panel-dispatch">
  <div class="counter">dispatched: <span id="sentCount">0</span> &nbsp;|&nbsp; ok: <span id="okCount">0</span> &nbsp;|&nbsp; fail: <span id="failCount">0</span> &nbsp;|&nbsp; loaded: <span id="loadedCount">0</span></div>
  <div class="row">
    <select id="cc">
      <option value="+1">+1 US</option>
      <option value="+44">+44 UK</option>
      <option value="+91">+91 IN</option>
      <option value="+33">+33 FR</option>
      <option value="+49">+49 DE</option>
      <option value="+81">+81 JP</option>
      <option value="+86">+86 CN</option>
      <option value="+7">+7 RU</option>
      <option value="+55">+55 BR</option>
      <option value="+61">+61 AU</option>
      <option value="+39">+39 IT</option>
      <option value="+34">+34 ES</option>
      <option value="+52">+52 MX</option>
      <option value="+27">+27 ZA</option>
      <option value="+82">+82 KR</option>
      <option value="+31">+31 NL</option>
      <option value="+46">+46 SE</option>
      <option value="+41">+41 CH</option>
      <option value="+48">+48 PL</option>
      <option value="+90">+90 TR</option>
      <option value="+62">+62 ID</option>
      <option value="+60">+60 MY</option>
      <option value="+65">+65 SG</option>
      <option value="+66">+66 TH</option>
      <option value="+84">+84 VN</option>
      <option value="+92">+92 PK</option>
      <option value="+880">+880 BD</option>
      <option value="+20">+20 EG</option>
      <option value="+234">+234 NG</option>
      <option value="+254">+254 KE</option>
    </select>
    <input id="recipient" type="tel" placeholder="phone number (digits only)" />
  </div>
  <div class="row">
    <button id="startDispatch">start bombing</button>
    <button id="stopDispatch" class="stop">stop</button>
  </div>
  <div class="log" id="dispatchLog"></div>
</div>

<script>
document.querySelectorAll(".tab").forEach((t) => {
  t.onclick = () => {
    document.querySelectorAll(".tab").forEach((x) => x.classList.remove("active"));
    document.querySelectorAll(".panel").forEach((x) => x.classList.remove("active"));
    t.classList.add("active");
    document.getElementById("panel-" + t.dataset.tab).classList.add("active");
  };
});

function ts() { return new Date().toTimeString().slice(0, 8); }
function appendLog(el, html, cls) {
  const div = document.createElement("div");
  div.className = cls || "";
  div.innerHTML = `<span class="ts">[${ts()}]</span>${html}`;
  el.appendChild(div);
  el.scrollTop = el.scrollHeight;
}
function setDot(id, on) { document.getElementById(id).classList.toggle("on", on); }

// SCAN
const scanLog = document.getElementById("scanLog");
const scanCount = document.getElementById("scanCount");
const fileCount = document.getElementById("fileCount");
let scanHits = 0;
let scanSSE = null;

function connectScan() {
  if (scanSSE) scanSSE.close();
  scanSSE = new EventSource("/api/scan/stream");
  scanSSE.onopen = () => setDot("dotScan", true);
  scanSSE.onerror = () => setDot("dotScan", false);
  scanSSE.onmessage = (e) => {
    const d = JSON.parse(e.data);
    if (d.done) {
      appendLog(scanLog, `scan complete — found ${d.found}, total in file ${d.total}`, "hit");
      fileCount.textContent = d.total;
      document.getElementById("scanStatus").textContent = "idle";
      return;
    }
    if (d.ok) {
      scanHits++;
      scanCount.textContent = scanHits;
      appendLog(scanLog, `${d.domain}${d.path} → ${d.status} HIT`, "hit");
    } else {
      appendLog(scanLog, `${d.domain}${d.path} → miss`, "miss");
    }
  };
}
connectScan();

document.getElementById("startScan").onclick = async () => {
  const raw = document.getElementById("domains").value.trim();
  const auto = document.getElementById("autoScan").checked;
  const targets = raw ? raw.split(/\n+/).map((s) => s.trim()).filter(Boolean) : [];
  if (!targets.length && !auto) return alert("enter domains or check auto-scan");
  scanHits = 0;
  scanCount.textContent = "0";
  scanLog.innerHTML = "";
  document.getElementById("scanStatus").textContent = "scanning...";
  await fetch("/api/scan", {
    method: "POST",
    headers: { "Content-Type": "application/json" },
    body: JSON.stringify({ targets, auto }),
  });
};

document.getElementById("stopScan").onclick = () => fetch("/api/scan/stop");

// DISPATCH
const dispatchLog = document.getElementById("dispatchLog");
const sentCount = document.getElementById("sentCount");
const okCount = document.getElementById("okCount");
const failCount = document.getElementById("failCount");
const loadedCount = document.getElementById("loadedCount");
let dispatchSSE = null;

function connectDispatch() {
  if (dispatchSSE) dispatchSSE.close();
  dispatchSSE = new EventSource("/api/dispatch/stream");
  dispatchSSE.onopen = () => setDot("dotDispatch", true);
  dispatchSSE.onerror = () => setDot("dotDispatch", false);
  dispatchSSE.onmessage = (e) => {
    const d = JSON.parse(e.data);
    if (d.done) {
      appendLog(dispatchLog, `run complete — sent ${d.stats.sent}, ok ${d.stats.success}, fail ${d.stats.fail}`, "hit");
      return;
    }
    const s = d.stats;
    sentCount.textContent = s.sent;
    okCount.textContent = s.success;
    failCount.textContent = s.fail;
    appendLog(dispatchLog, `${d.name} → ${d.status} ${d.ok ? "OK" : "FAIL"}`, d.ok ? "hit" : "fail");
  };
}
connectDispatch();

document.getElementById("startDispatch").onclick = async () => {
  const country_code = document.getElementById("cc").value;
  const recipient = document.getElementById("recipient").value.replace(/\D/g, "");
  if (!recipient) return alert("enter a number");
  dispatchLog.innerHTML = "";
  sentCount.textContent = "0";
  okCount.textContent = "0";
  failCount.textContent = "0";
  const r = await fetch("/api/dispatch", {
    method: "POST",
    headers: { "Content-Type": "application/json" },
    body: JSON.stringify({ country_code, recipient }),
  });
  const j = await r.json();
  if (j.error) return alert(j.error);
  loadedCount.textContent = j.endpoints;
};

document.getElementById("stopDispatch").onclick = () => fetch("/api/dispatch/stop");

fetch("/api/stats").then(r => r.json()).then(j => {
  loadedCount.textContent = j.endpoints || 0;
  fileCount.textContent = j.endpoints || 0;
}).catch(() => {});
</script>
</body>
</html>
